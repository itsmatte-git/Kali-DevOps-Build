---
- hosts: localhost
  connection: local
  become: true

  tasks:

    - block:
        - name: Install packages
          package:
            name: "{{ item }}"
            state: present
          loop:
            - python3-venv                # python virtual env
            - bloodhound                  # AD attack path tool
            - filezilla                   # GUI FTP/SFTP client
            - remmina                     # Remote desktop client (RDP, VNC, SSH)
            - docker.io                   # Docker engine
            - gobuster                    # Directory brute force tool
            - seclists                    # Wordlist collection
            - feroxbuster                 # Content discovery tool
            - redis-tools                 # CLI tool for Redis
            - xclip                       # Clipboard access from terminal
            - chisel                      # TCP tunnel / pivoting tool
            - mingw-w64                   # Windows cross-compiler
            - guake                       # Drop-down terminal emulator
            - dconf-cli                   # GNOME/XFCE config tool
            - gnome-font-viewer           # Font preview tool

      rescue:                                                                               # Logs warning and continues execution when package install fails
        - name: Warn about failed package install
          debug:
            msg: >
              One or more packages failed to install.
              This is expected on Kali rolling.
              Continuing with remaining setup.

    - block:                                                                                # VS Code install
    - name: Install Visual Studio Code
      apt:
        deb: https://go.microsoft.com/fwlink/?LinkID=760868
      rescue:
        - debug:
            msg: "VS Code download failed (network or URL issue). Skipping."


    - name: Copy ZSH profile                                                                
      copy:
        src: /home/kali/Kali-DevOps-Build/config/.zshrc
        dest: /home/kali/.zshrc
        owner: kali
        group: kali
        mode: '0644'

    - name: Copy Tmux profile
      copy:
        src: /home/kali/Kali-DevOps-Build/config/.tmux.conf
        dest: /home/kali/.tmux.conf
        owner: kali
        group: kali
        mode: '0644'

    - name: Copy p10k profile
      copy:
        src: /home/kali/Kali-DevOps-Build/config/.p10k.zsh
        dest: /home/kali/.p10k.zsh
        owner: kali
        group: kali
        mode: '0644'

    - name: Copy ctf script
      copy:
        src: /home/kali/Kali-DevOps-Build/scripts/ctf
        dest: /usr/local/sbin/ctf
        owner: kali
        group: kali
        mode: '0777'

    - name: Clone tmux plugin manager
      git:
        repo: https://github.com/tmux-plugins/tpm
        dest: /home/kali/.tmux/plugins/tpm
        update: yes

    - name: Clone powerlevel10k
      git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: /home/kali/powerlevel10k
        update: yes

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: kali
        group: kali
      loop:
        - /home/kali/.local/share/fonts
        - /home/kali/share
        - /home/kali/scripts

    - name: Copy ipaddress script
      copy:
        src: /home/kali/Kali-DevOps-Build/scripts/ipaddress.sh
        dest: /home/kali/scripts/ipaddress.sh
        owner: kali
        group: kali
        mode: '0777'

    - name: Download tools                                                              # Download tools
      get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        mode: '0755'
      loop:
        - { url: https://github.com/DominicBreuker/pspy/releases/download/v1.2.0/pspy32, dest: /home/kali/share/pspy32 }                      # pspy32
        - { url: https://github.com/DominicBreuker/pspy/releases/download/v1.2.0/pspy64, dest: /home/kali/share/pspy64 }                      # pspy64
        - { url: https://github.com/carlospolop/PEASS-ng/releases/latest/download/linpeas.sh, dest: /home/kali/share/linpeas.sh }             # Linpeas
        - { url: https://github.com/carlospolop/PEASS-ng/releases/latest/download/winPEAS.bat, dest: /home/kali/share/winpeas.bay}            # Winpeas

    - name: Download Meslo fonts
      get_url:
        url: "{{ item }}"
        dest: "/home/kali/.local/share/fonts/{{ item | basename }}"
      loop:
        - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Regular.ttf
        - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold.ttf
        - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Italic.ttf
        - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold%20Italic.ttf

    - name: Fix ownerships
      file:
        path: "{{ item }}"
        recurse: yes
        owner: kali
        group: kali
      loop:
        - /home/kali/.tmux
        - /home/kali/powerlevel10k
        - /home/kali/scripts
        - /home/kali/share

    - name: Start Guake
      command: su -c 'guake &' kali
      ignore_errors: true

    - name: Configure Guake
      command: su -c 'guake --restore-preferences=/home/kali/Kali-DevOps-Build/config/guake.conf' kali
      ignore_errors: true

    - name: Set timezone
      timezone:
        name: Australia/Sydney
